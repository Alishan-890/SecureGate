{% extends "base.html" %}{% block title %}Register - SecureGate{% endblock %}{% block content %}
<div class="auth-shell"><div class="card auth-card p-4 p-md-5"><div class="auth-brand mb-4"><div class="brand-mark mb-3"><span class="shield-icon" aria-hidden="true">SG</span><span class="h4 mb-0">SecureGate</span></div><div class="eyebrow">NEW ANALYST ACCESS</div><h1 class="h3 mt-2">Create account</h1></div>
<form method="post" novalidate><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="username">Username</label><input class="form-control mb-2" id="username" name="username" value="{{ request.form.get('username', '') }}" pattern="[A-Za-z0-9_]{3,30}" required><div class="form-text mb-3">3-30 characters: letters, numbers, and underscores only.</div>
<label class="form-label" for="password">Password</label><input class="form-control mb-2" id="password" type="password" name="password" minlength="8" required><div class="form-text mb-3">Use at least 8 characters.</div><button class="lux-btn-primary w-100">Register</button></form>
<p class="mt-4 mb-0 text-center"><a class="lux-link" href="{{ url_for('login') }}">Back to sign in</a></p></div></div>{% endblock %}
